<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSL 2026 · Live Bid Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A110E; --panel:#121C17; --panel2:#17241E; --line:#24332B; --line2:#3A4D43;
    --text:#EEF3EF; --muted:#9AAAA1; --faint:#6F8178; --accent:#C8F03C; --sold:#FF7A1A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text)}
  button{font-family:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.4}
  .cond{font-family:'Barlow Condensed',sans-serif}

  /* 1920x1080 stage, scaled to fit any screen */
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;
    padding:40px 56px;display:flex;flex-direction:column;gap:28px;background:var(--bg);overflow:hidden}

  .header{display:flex;align-items:center;justify-content:space-between;height:80px}
  .brand{display:flex;align-items:center;gap:24px}
  .brand img{height:96px;width:auto;display:block;margin-left:-24px}
  .divider{width:2px;height:52px;background:var(--line)}
  .title{font-weight:800;font-size:36px;letter-spacing:.04em;text-transform:uppercase;line-height:1;color:var(--accent)}
  .sub{font-size:16px;color:var(--muted);font-weight:500;margin-top:4px}
  .chips{display:flex;align-items:center;gap:14px}
  .chip{padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:16px;font-weight:600;color:var(--muted)}
  .chip b{color:var(--text)}
  .status{padding:10px 18px;border-radius:999px;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  .main{display:flex;gap:28px;flex:1 1 auto;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:24px}

  .player{width:540px;flex:0 0 540px;overflow:hidden;display:flex;flex-direction:column}
  .art{height:420px;position:relative;background:var(--panel2);display:flex;align-items:center;justify-content:center}
  .art svg{width:100%;height:420px;display:block}
  .block-tag{position:absolute;top:20px;left:20px;padding:8px 14px;background:var(--accent);color:var(--bg);border-radius:10px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .pinfo{padding:28px;display:flex;flex-direction:column;gap:22px;flex:1 1 auto;justify-content:center}
  .label{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pname{font-weight:800;font-size:60px;line-height:1;text-transform:uppercase;margin-top:6px}
  .pos{display:inline-block;margin-top:8px;padding:8px 18px;color:var(--bg);border-radius:10px;font-weight:800;font-size:34px;letter-spacing:.04em;text-transform:uppercase}
  .upnext{display:flex;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line);font-size:16px;color:var(--muted);font-weight:500}
  .upnext span{color:var(--text);font-weight:700}

  .middle{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  .history{flex:1 1 auto;min-height:0;padding:28px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
  .h-title{display:flex;justify-content:space-between;align-items:baseline}
  .h-title .cond{font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.04em}
  .h-title .count{font-size:15px;color:var(--muted);font-weight:500}
  .empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:18px;border:1px dashed var(--line);border-radius:16px;padding:32px}
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--panel2)}
  .row.top{background:#1E2E17;border-color:var(--accent)}
  .row .team{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600}
  .dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
  .row .amt{font-weight:700;font-size:28px}

  .bidpanel{width:600px;flex:0 0 600px;padding:28px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
  .base{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .base .cond{font-weight:700;font-size:32px}
  .cur-label{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .bid{font-weight:800;font-size:128px;line-height:.95;letter-spacing:-.01em;margin-top:6px}
  .leader{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:22px;font-weight:600}
  .leader .dot{width:16px;height:16px;border-radius:5px}
  .small-label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .grid{display:grid;gap:10px}
  .step{height:48px;border-radius:12px;font-size:18px;font-weight:700;border:1px solid var(--line2);background:transparent;color:var(--text)}
  .step.on{border:0;background:var(--accent);color:var(--bg)}
  .teambtn{height:72px;border-radius:12px;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
  .teambtn.lead{border:2px solid var(--accent);background:#1E2E17}
  .teambtn .dot{width:10px;height:10px;border-radius:3px}
  .teambtn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{margin-top:auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
  .sold-btn{height:64px;border-radius:14px;border:0;background:var(--accent);color:var(--bg);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
  .ghost{height:64px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:17px;font-weight:700}

  .stamp-wrap{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
  .stamp{transform:rotate(-8deg);background:rgba(10,17,14,.92);border-radius:18px;padding:14px 34px;text-align:center;border:6px solid}
  .stamp .big{font-weight:800;font-size:96px;line-height:1;letter-spacing:.08em}
  .stamp .small{font-size:22px;font-weight:700;color:var(--text)}

  .purses{display:grid;gap:16px;height:104px}
  .purse{border-radius:16px;padding:14px 24px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel);border:1px solid var(--line)}
  .purse.lead{background:#1E2E17;border:2px solid var(--accent)}
  .purse .n{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
  .purse .n .dot{width:10px;height:10px;border-radius:3px}
  .purse .left{font-weight:700;font-size:30px;line-height:1}
  .purse .sq{font-size:13px;color:var(--muted);font-weight:500}

  .reset{position:fixed;right:10px;bottom:8px;font-size:12px;color:var(--faint);background:none;border:0;opacity:.5}
  .reset:hover{opacity:1}
</style>
</head>

};
/* ========================================================== */

const TEAM_COLORS = ['#4C9AFF','#FF9F43','#2EC4B6','#E05BC1','#F4D35E','#8C7AE6','#FF6B6B','#7BD389'];
const META = {
  GK:{label:'Goalkeeper',color:'#F4D35E'}, DEF:{label:'Defender',color:'#4C9AFF'},
  MID:{label:'Midfielder',color:'#2EC4B6'}, FWD:{label:'Forward',color:'#FF7A1A'},
  RB:{label:'Right Defender',color:'#8C7AE6'}, LB:{label:'Left Defender',color:'#E05BC1'}
};
const KEY = 'bsl-2026-auction';
const $ = (id) => document.getElementById(id);
const fmt = (n) => CONFIG.currency === 'Pts' ? n.toLocaleString('en-IN') + ' pts' : CONFIG.currency + n.toLocaleString('en-IN');
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fresh() {
  return {
    idx:0, done:false, bid:null, leader:null, step:0, history:[], sold:false, unsold:false,
    queue: CONFIG.players.map(([name,pos]) => ({name, pos, again:false})),
    spent: CONFIG.teams.map(() => 0), squad: CONFIG.teams.map(() => 0),
    bought: CONFIG.teams.map(() => [])
  };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.queue ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load() || fresh();

const steps = () => [CONFIG.increment, CONFIG.increment * 2, CONFIG.increment * 5];
const current = () => S.queue[S.idx] || S.queue[S.queue.length - 1];
const locked = () => S.sold || S.unsold || S.done;
const nextBid = () => S.bid == null ? CONFIG.basePrice : S.bid + steps()[S.step];

/* ---------- position artwork ---------- */
const BALL = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#F2F5F3" stroke="#0A110E" stroke-width="2"></circle>
  <polygon points="${x},${y-8} ${x+7.6},${y-2.5} ${x+4.7},${y+6.5} ${x-4.7},${y+6.5} ${x-7.6},${y-2.5}" fill="#0A110E"></polygon>`;
const HEAD = (cx) => `<circle cx="${cx}" cy="112" r="28" fill="#C68B59"></circle>
  <path d="M${cx-28} 108a28 28 0 0 1 56 0q-28 -14 -56 0z" fill="#2A211C"></path>`;
const MARK = (t, size) => `<text x="270" y="320" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="${size}" fill="#1C2B23">${t}</text>`;
const SHORTS = `<rect x="226" y="232" width="88" height="44" rx="12" fill="#F2F5F3"></rect>`;

function art(pos, c) {
  const open = `<svg viewBox="0 0 540 420" role="img" aria-label="${META[pos] ? META[pos].label : 'Player'} illustration">`;
  if (pos === 'GK') return open + MARK('GK', 280) +
    `<path d="M110 120V385M160 120V385M210 120V385M330 120V385M380 120V385M430 120V385M60 170H480M60 220H480M60 270H480M60 320H480" stroke="#22332A" stroke-width="2"></path>
     <path d="M60 385V120H480V385" fill="none" stroke="#3A4D43" stroke-width="8" stroke-linejoin="round"></path>
     <ellipse cx="270" cy="386" rx="110" ry="10" fill="#0F1813"></ellipse>
     <path d="M250 272L220 330M290 272L320 330" stroke="#C68B59" stroke-width="22" stroke-linecap="round"></path>
     <path d="M220 330L205 370M320 330L335 370" stroke="${c}" stroke-width="22" stroke-linecap="round"></path>
     <ellipse cx="200" cy="378" rx="20" ry="9" fill="#0A110E"></ellipse><ellipse cx="340" cy="378" rx="20" ry="9" fill="#0A110E"></ellipse>
     ${SHORTS}
     <path d="M236 160L185 95M304 160L355 95" stroke="${c}" stroke-width="22" stroke-linecap="round"></path>
     <rect x="224" y="140" width="92" height="104" rx="30" fill="${c}"></rect>
     <circle cx="180" cy="86" r="19" fill="#EEF3EF" stroke="#0A110E" stroke-width="3"></circle>
     <circle cx="360" cy="86" r="19" fill="#EEF3EF" stroke="#0A110E" stroke-width="3"></circle>
     ${HEAD(270)}${BALL(270, 50, 22)}</svg>`;
  if (pos === 'MID') return open + MARK('MID', 230) +
    `<path d="M404 340C462 280 472 200 432 136" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 12"></path>
     <polygon points="416,140 430,112 446,138" fill="${c}"></polygon>
     <ellipse cx="285" cy="386" rx="120" ry="10" fill="#0F1813"></ellipse>
     <path d="M255 272L230 325M290 272L318 322" stroke="#C68B59" stroke-width="22" stroke-linecap="round"></path>
     <path d="M230 325L205 365M318 322L332 368" stroke="${c}" stroke-width="22" stroke-linecap="round"></path>
     <ellipse cx="198" cy="372" rx="20" ry="9" fill="#0A110E"></ellipse><ellipse cx="342" cy="376" rx="20" ry="9" fill="#0A110E"></ellipse>
     ${BALL(384, 368, 20)}${SHORTS}
     <path d="M234 160L200 225M306 160L345 210" stroke="#C68B59" stroke-width="20" stroke-linecap="round"></path>
     <rect x="224" y="140" width="92" height="104" rx="30" fill="${c}"></rect>
     ${HEAD(272)}</svg>`;
  if (pos === 'FWD') return open + MARK('FWD', 230) +
    `<ellipse cx="260" cy="386" rx="110" ry="10" fill="#0F1813"></ellipse>
     <path d="M250 272L240 330M292 268L345 300" stroke="#C68B59" stroke-width="22" stroke-linecap="round"></path>
     <path d="M240 330L235 370M345 300L392 300" stroke="${c}" stroke-width="22" stroke-linecap="round"></path>
     <ellipse cx="232" cy="378" rx="20" ry="9" fill="#0A110E"></ellipse><ellipse cx="408" cy="300" rx="20" ry="10" fill="#0A110E"></ellipse>
     <path d="M400 232H440M392 252H436M402 272H440" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity="0.7"></path>
     ${BALL(472, 250, 22)}${SHORTS}
     <path d="M234 160L178 192M306 160L332 216" stroke="#C68B59" stroke-width="20" stroke-linecap="round"></path>
     <rect x="224" y="140" width="92" height="104" rx="30" fill="${c}" transform="rotate(-10 270 190)"></rect>
     ${HEAD(262)}</svg>`;
  // DEF, RB, LB (RB is mirrored)
  const flip = pos === 'RB' ? 'translate(540 0) scale(-1 1)' : 'translate(0 0)';
  return open + MARK(esc(pos), 220) +
    `<g transform="${flip}">
     <path d="M440 46L480 60V96C480 122 462 136 440 146C418 136 400 122 400 96V60Z" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round" opacity="0.7"></path>
     <ellipse cx="240" cy="386" rx="130" ry="10" fill="#0F1813"></ellipse>
     <path d="M292 272L300 330M250 268L200 318" stroke="#C68B59" stroke-width="22" stroke-linecap="round"></path>
     <path d="M300 330L305 370M200 318L152 350" stroke="${c}" stroke-width="22" stroke-linecap="round"></path>
     <ellipse cx="312" cy="378" rx="20" ry="9" fill="#0A110E"></ellipse><ellipse cx="140" cy="356" rx="20" ry="9" fill="#0A110E"></ellipse>
     ${BALL(104, 368, 20)}${SHORTS}
     <path d="M234 160L170 205M306 160L372 190" stroke="#C68B59" stroke-width="20" stroke-linecap="round"></path>
     <rect x="224" y="140" width="92" height="104" rx="30" fill="${c}" transform="rotate(-8 270 190)"></rect>
     ${HEAD(264)}</g></svg>`;
}

/* ---------- render ---------- */
let lastArt = '';
function render() {
  const cur = current();
  const m = META[cur.pos] || META.MID;
  const nxt = S.queue[S.idx + 1];
  const n = CONFIG.teams.length;

  $('lotNum').textContent = String(Math.min(S.idx + 1, S.queue.length)).padStart(2, '0') + ' / ' + String(S.queue.length).padStart(2, '0');
  let label = 'Bidding open', style = 'background:#C8F03C;color:#0A110E';
  if (S.sold) { label = 'Sold'; style = 'background:#FF7A1A;color:#0A110E'; }
  else if (S.unsold) { label = 'Unsold'; style = 'background:#3A4D43;color:#EEF3EF'; }
  if (S.done) { label = 'Auction complete'; style = 'background:#EEF3EF;color:#0A110E'; }
  else if (cur.again && !S.sold && !S.unsold) { label = 'Second round'; style = 'background:#F4D35E;color:#0A110E'; }
  $('status').textContent = label; $('status').style.cssText = style;

  const artKey = cur.pos + m.color;
  if (artKey !== lastArt) { $('art').innerHTML = art(cur.pos, m.color); lastArt = artKey; }
  $('pname').textContent = cur.name;
  $('pos').textContent = cur.pos + ' · ' + m.label;
  $('pos').style.background = m.color;
  $('upnext').textContent = S.done ? 'None' : (nxt ? nxt.name + ' · ' + nxt.pos : 'Last player');

  $('hcount').textContent = S.history.length ? 'Last ' + S.history.length + ' bids' : 'Last 5 bids';
  $('hbody').innerHTML = S.history.length
    ? '<div class="rows">' + S.history.map((h, i) => `<div class="row${i === 0 ? ' top' : ''}"><div class="team"><div class="dot" style="background:${TEAM_COLORS[h.team]}"></div>${esc(CONFIG.teams[h.team])}</div><div class="amt cond">${fmt(h.value)}</div></div>`).join('') + '</div>'
    : '<div class="empty">Waiting for the opening bid at base price</div>';

  $('base').textContent = fmt(CONFIG.basePrice);
  $('bid').textContent = fmt(S.bid == null ? CONFIG.basePrice : S.bid);
  $('leadName').textContent = S.leader == null ? 'No bids yet' : CONFIG.teams[S.leader];
  $('leadDot').style.background = S.leader == null ? '#3A4D43' : TEAM_COLORS[S.leader];

  $('steps').innerHTML = steps().map((v, i) => `<button type="button" class="step${S.step === i ? ' on' : ''}" data-step="${i}">+ ${fmt(v)}</button>`).join('');

  const nb = nextBid();
  $('teambtns').style.gridTemplateColumns = `repeat(${Math.min(n, 4)},minmax(0,1fr))`;
  $('teambtns').innerHTML = CONFIG.teams.map((t, i) => {
    const left = CONFIG.totalPurse - S.spent[i];
    const dis = locked() || S.leader === i || S.squad[i] >= CONFIG.squadSize || left < nb;
    return `<button type="button" class="teambtn${S.leader === i ? ' lead' : ''}" data-team="${i}"${dis ? ' disabled' : ''}><span class="dot" style="background:${TEAM_COLORS[i]}"></span><span>${esc(t)}</span></button>`;
  }).join('');

  $('purses').style.gridTemplateColumns = `repeat(${n},minmax(0,1fr))`;
  $('purses').innerHTML = CONFIG.teams.map((t, i) => `<div class="purse${S.leader === i ? ' lead' : ''}" title="${esc(S.bought[i].join(', '))}">
      <div class="n"><div class="dot" style="background:${TEAM_COLORS[i]}"></div><span>${esc(t)}</span></div>
      <div class="left cond">${fmt(CONFIG.totalPurse - S.spent[i])}</div>
      <div class="sq">${S.squad[i]} / ${CONFIG.squadSize} players</div></div>`).join('');

  $('btnSold').disabled = locked() || S.bid == null;
  $('btnUnsold').disabled = locked() || S.bid != null;
  $('btnNext').disabled = S.done || !(S.sold || S.unsold);

  $('stamp').innerHTML = S.sold
    ? `<div class="stamp-wrap" style="top:150px"><div class="stamp" style="border-color:#FF7A1A;color:#FF7A1A"><div class="big cond">SOLD</div><div class="small">to ${esc(CONFIG.teams[S.leader])} · ${fmt(S.bid)}</div></div></div>`
    : S.unsold
      ? `<div class="stamp-wrap" style="top:170px"><div class="stamp" style="border-color:#9AAAA1;color:#9AAAA1"><div class="big cond" style="font-size:88px">UNSOLD</div></div></div>`
      : '';
  save();
}

/* ---------- actions ---------- */
document.addEventListener('click', (e) => {
  const step = e.target.closest('[data-step]');
  if (step) { S.step = +step.dataset.step; return render(); }
  const team = e.target.closest('[data-team]');
  if (team && !team.disabled) {
    const i = +team.dataset.team, v = nextBid();
    S.bid = v; S.leader = i;
    S.history = [{ team: i, value: v }].concat(S.history).slice(0, 5);
    return render();
  }
});
$('btnSold').onclick = () => {
  if (locked() || S.bid == null) return;
  S.spent[S.leader] += S.bid; S.squad[S.leader] += 1; S.bought[S.leader].push(current().name);
  S.sold = true; render();
};
$('btnUnsold').onclick = () => { if (!locked() && S.bid == null) { S.unsold = true; render(); } };
$('btnNext').onclick = () => {
  if (S.done || !(S.sold || S.unsold)) return;
  const cur = current();
  if (S.unsold && !cur.again) S.queue.push({ name: cur.name, pos: cur.pos, again: true });
  const allFull = S.squad.every((q) => q >= CONFIG.squadSize);
  if (S.idx + 1 >= S.queue.length || allFull) { S.done = true; return render(); }
  Object.assign(S, { idx: S.idx + 1, bid: null, leader: null, history: [], sold: false, unsold: false });
  render();
};
$('btnReset').onclick = () => { if (confirm('Reset the whole auction? All bids and purchases will be cleared.')) { S = fresh(); render(); } };

/* ---------- fit the 1920x1080 stage to the window ---------- */
function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);
fit(); render();
</script>
</body>
</html>
